<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id/Password Manager</title>
    <link rel="stylesheet" href="../CSS/style.css"> <!--CSS 연결-->
    <script src="../JS/input.js" defer></script> <!--자바스크립트 연결-->
</head>
<body>
    <div class="container">
        <header class="header">Id/Password Manager</header>
        <section class="content">
            <table>
                <caption id="caption">My Account Information</caption>
                <thead>
                    <tr><th>Site Name</th><th>Id</th><th>Password</th><th>Manage</th></tr>
                </thead>
                <tbody id="tableBody">
                    <!--입력된 내용이 추가되는 곳--> 
                </tbody>
            </table>
            <br>
            <div id="inputForm">
                <input type="text" id="inputSite" placeholder="Enter siteName">
                <input type="text" id="inputId" placeholder="Enter your Id">
                <input type="text" id="inputPw" placeholder="Enter your Password">
                <button id="addBtn">Enter</button>
            </div>
        </section>
    </div>
</body>
</html>
